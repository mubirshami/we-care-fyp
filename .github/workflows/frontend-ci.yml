# .github/workflows/frontend-ci.yml

name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/**'

  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/**'

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Node.js version
        run: node -v

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build